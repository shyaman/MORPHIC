[project]
name = "morphic"
version = "0.1.0"
description = "H&E-based directed ligand-receptor scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.34,<1",
  "imagecodecs>=2024.12,<2026",
  "instanseg-torch>=0.1.1,<1",
  "numpy>=2,<2.3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "pyarrow>=18,<22",
  "pyyaml>=6,<7",
  "scikit-image>=0.25,<0.26",
  "scipy>=1.14,<2",
  "shapely>=2,<3",
  "tifffile==2025.5.10",
  "timm==1.0.19",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "zarr>=2.18,<3",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
